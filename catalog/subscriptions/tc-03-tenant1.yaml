apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
  name: tc-03-tenant1
  namespace: models-as-a-service
spec:
  inferencePriority: 5
  modelRefs:
  - billingRate:
      perToken: "0.000001"
    name: granite-4-tiny
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1m
    - limit: 100000
      window: 1h
  organization:
    id: tenant1
  owner:
    groups:
    - name: tenant1/developers
    users:
    - tc03-user
  priority: 5
  tokenMetadata:
    costCenter: tc03-test
    labels:
      test_case: TC-03
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  labels:
    ai-grid/subscription: tc-03-tenant1
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: tc-03-tenant1-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: granite-4-tiny
    namespace: models-as-a-service
  subjects:
    groups:
    - name: tenant1/developers
    users:
    - tc03-user
