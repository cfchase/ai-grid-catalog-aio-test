apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    ai-grid/clusters: ""
    ai-grid/version: "2"
  labels:
    ai-grid/model: tc-02-ui-unplaced
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: tc-02-ui-unplaced
  namespace: ai-grid-internal-models
spec:
  model:
    name: tc-02-ui-unplaced
    uri: hf://HuggingFaceTB/SmolLM2-135M-Instruct
  replicas: 1
  router:
    gateway:
      refs:
      - name: openshift-ai-inference
        namespace: openshift-ingress
    route: {}
  template:
    containers:
    - name: main
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    ai-grid/model: tc-02-ui-unplaced
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: tc-02-ui-unplaced-grid
  namespace: ai-grid-internal-models
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ai-grid
    ports:
    - port: 8000
      protocol: TCP
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tc-02-ui-unplaced
  policyTypes:
  - Ingress
